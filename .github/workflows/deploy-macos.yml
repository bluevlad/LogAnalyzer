name: Deploy to OrbStack (macOS)

on:
  push:
    branches: [ "prod" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.github/**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# A second push waits for the running deploy instead of overlapping it.
concurrency:
  group: loganalyzer-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy LogAnalyzer to OrbStack
    runs-on: [self-hosted, macos, orbstack]

    defaults:
      run:
        shell: bash

    env:
      # Pin the compose project so the runner workspace replaces the existing
      # containers (originally started from the developer checkout).
      COMPOSE_PROJECT_NAME: loganalyzer
      COMPOSE_FILE: docker-compose.prod.yml
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

    steps:
    # Build the pushed commit in the runner workspace. Do not reset a
    # developer's checkout or replace its environment file.
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Connect runtime environment
      run: |
        test -n "$DEPLOY_PATH" || { echo "ERROR: repo variable DEPLOY_PATH is not set"; exit 1; }
        test -f "$DEPLOY_PATH/.env" || { echo "ERROR: $DEPLOY_PATH/.env not found"; exit 1; }
        ln -sfn "$DEPLOY_PATH/.env" .env

    - name: Check if Docker rebuild needed
      id: check-docker
      env:
        BEFORE: ${{ github.event.before }}
      run: |
        need_restart=false
        if [ "${{ github.event_name }}" != "push" ] \
          || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
          || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
          echo "Manual run, new branch or unknown base: full rebuild"
          need_restart=true
        else
          # Compare the whole push range, not just the last commit.
          changed_files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "Changed files:"
          echo "$changed_files"
          while IFS= read -r file; do
            case "$file" in
              backend/*|frontend/*|docker-compose*.yml|Dockerfile*)
                need_restart=true
                echo "Docker rebuild needed: $file"
                break
                ;;
            esac
          done <<< "$changed_files"
        fi

        echo "Need Docker rebuild: $need_restart"
        echo "need_restart=$need_restart" >> "$GITHUB_OUTPUT"

    - name: Ensure shared PostgreSQL and loganalyzer database
      if: steps.check-docker.outputs.need_restart == 'true'
      run: |
        docker exec postgresql pg_isready -U postgres || {
          echo "ERROR: Shared PostgreSQL container is not running"
          exit 1
        }
        docker exec postgresql psql -U postgres -tc \
          "SELECT 1 FROM pg_database WHERE datname = 'loganalyzer'" | grep -q 1 || {
          echo "Creating loganalyzer database..."
          docker exec postgresql psql -U postgres -c "CREATE DATABASE loganalyzer;"
        }
        # The service account must be provisioned manually with a real password.
        docker exec postgresql psql -U postgres -tc \
          "SELECT 1 FROM pg_roles WHERE rolname = 'loganalyzer_svc'" | grep -q 1 || {
          echo "ERROR: role loganalyzer_svc does not exist; create it to match LA_DATABASE_URL"
          exit 1
        }

    # `up --build` builds first and only then recreates changed containers,
    # so the running service stays up during the image build.
    - name: Build and start containers
      if: steps.check-docker.outputs.need_restart == 'true'
      run: docker compose up -d --build --remove-orphans

    - name: Wait for backend health check
      if: steps.check-docker.outputs.need_restart == 'true'
      run: |
        echo "Waiting for backend to be healthy..."
        for i in $(seq 1 30); do
          if curl -sf http://localhost:9092/api/health > /dev/null 2>&1; then
            echo "Backend is healthy!"
            curl -s http://localhost:9092/api/health | python3 -m json.tool
            break
          fi
          if [ $i -eq 30 ]; then
            echo "Backend health check timeout"
            docker compose logs backend --tail=50
            exit 1
          fi
          sleep 2
        done

    - name: Verify frontend
      if: steps.check-docker.outputs.need_restart == 'true'
      run: |
        echo "Checking frontend..."
        for i in $(seq 1 15); do
          if curl -sf http://localhost:4092/ > /dev/null 2>&1; then
            echo "Frontend is serving!"
            break
          fi
          if [ $i -eq 15 ]; then
            echo "Frontend verification timeout"
            docker compose logs frontend --tail=30
            exit 1
          fi
          sleep 2
        done

    - name: Verify log collection capability
      if: steps.check-docker.outputs.need_restart == 'true'
      run: |
        echo "Checking Docker socket access..."
        docker exec loganalyzer-backend python3 -c "
        import docker
        client = docker.from_env()
        containers = client.containers.list()
        print(f'Docker access OK: {len(containers)} containers visible')
        " 2>/dev/null || echo "Docker socket verification skipped (container still initializing)"

    - name: Deployment summary
      if: steps.check-docker.outputs.need_restart == 'true'
      run: |
        echo "=========================================="
        echo "  LogAnalyzer Deployment Complete ($GITHUB_SHA)"
        echo "=========================================="
        echo "Frontend:  http://localhost:4092"
        echo "Backend:   http://localhost:9092"
        echo "API Docs:  http://localhost:9092/api/docs"
        echo ""
        docker compose ps

    - name: Skip Docker rebuild (no app changes)
      if: steps.check-docker.outputs.need_restart != 'true'
      run: |
        echo "=========================================="
        echo "Docker rebuild SKIPPED"
        echo "No backend/frontend/compose changes in this push"
        echo "=========================================="

    - name: Cleanup dangling images
      if: always()
      run: docker image prune -f 2>/dev/null || true
